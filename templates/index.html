<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Convenience - AI Location Intelligence</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(0, 255, 255, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: translateX(-50%) scale(1); }
            50% { opacity: 0.6; transform: translateX(-50%) scale(1.1); }
        }

        .logo {
            font-family: 'Orbitron', monospace;
            font-size: 3.5rem;
            font-weight: 900;
            background: linear-gradient(45deg, #00ffff, #ff00ff, #ffff00);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease-in-out infinite;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .tagline {
            font-size: 1.2rem;
            color: #a0a0a0;
            font-weight: 300;
            margin-bottom: 20px;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-bottom: 40px;
        }

        .input-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .input-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.1), transparent);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .section-title {
            font-family: 'Orbitron', monospace;
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #00ffff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #e0e0e0;
        }

        .url-input {
            width: 100%;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 10px;
            color: #ffffff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .url-input:focus {
            outline: none;
            border-color: #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }

        .url-input::placeholder {
            color: #666;
        }

        .analyze-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #00ffff, #ff00ff);
            border: none;
            border-radius: 10px;
            color: #000;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .analyze-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 255, 255, 0.4);
        }

        .analyze-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(0, 255, 255, 0.3);
            border-top: 3px solid #00ffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }

        .result-card {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid #00ffff;
        }

        .result-title {
            font-family: 'Orbitron', monospace;
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: #00ffff;
        }

        .viability-score {
            font-size: 2.5rem;
            font-weight: 900;
            text-align: center;
            margin: 20px 0;
            background: linear-gradient(45deg, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .recommendation {
            text-align: center;
            font-size: 1.3rem;
            font-weight: 600;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .recommendation.yes {
            background: rgba(0, 255, 0, 0.2);
            border: 1px solid #00ff00;
            color: #00ff00;
        }

        .recommendation.no {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid #ff0000;
            color: #ff0000;
        }

        .recommendation.maybe {
            background: rgba(255, 255, 0, 0.2);
            border: 1px solid #ffff00;
            color: #ffff00;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .feature-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .feature-value {
            font-size: 1.5rem;
            font-weight: 600;
            color: #00ffff;
        }

        .feature-label {
            font-size: 0.9rem;
            color: #a0a0a0;
            margin-top: 5px;
        }

        .map-container {
            grid-column: 1 / -1;
            margin-top: 30px;
        }

        .map-wrapper {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(0, 255, 255, 0.2);
        }

        .error-message {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid #ff0000;
            color: #ff0000;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
        }

        .success-message {
            background: rgba(0, 255, 0, 0.2);
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .logo {
                font-size: 2.5rem;
            }
            
            .container {
                padding: 10px;
            }
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="logo">PROJECT CONVENIENCE</h1>
            <p class="tagline">AI-Powered Location Intelligence for Smart Business Decisions</p>
        </div>

        <div class="main-content">
            <div class="input-section">
                <h2 class="section-title">
                    <i class="fas fa-map-marker-alt"></i>
                    Location Analysis
                </h2>
                
                <div class="input-group">
                    <label class="input-label" for="latitude">Latitude</label>
                    <input 
                        type="number" 
                        id="latitude" 
                        class="url-input" 
                        placeholder="e.g., 33.5138"
                        step="any"
                    >
                </div>
                
                <div class="input-group">
                    <label class="input-label" for="longitude">Longitude</label>
                    <input 
                        type="number" 
                        id="longitude" 
                        class="url-input" 
                        placeholder="e.g., 36.2765"
                        step="any"
                    >
                </div>
                
                <button id="analyzeBtn" class="analyze-btn">
                    <i class="fas fa-rocket"></i> Analyze Location
                </button>
                
                <div id="loading" class="loading">
                    <div class="spinner"></div>
                    <p>Analyzing location data...</p>
                </div>
            </div>

            <div class="results-section">
                <h2 class="section-title">
                    <i class="fas fa-chart-line"></i>
                    Analysis Results
                </h2>
                
                <div id="results" class="hidden">
                    <div class="result-card">
                        <h3 class="result-title">Convenience Store Viability</h3>
                        <div id="viabilityScore" class="viability-score">--</div>
                        <div id="recommendation" class="recommendation">--</div>
                    </div>
                    
                    <div class="result-card">
                        <h3 class="result-title">Location Features</h3>
                        <div id="featuresGrid" class="features-grid">
                            <!-- Features will be populated here -->
                        </div>
                    </div>
                </div>
                
                <div id="errorMessage" class="error-message hidden"></div>
                <div id="successMessage" class="success-message hidden"></div>
            </div>
        </div>

        <div id="mapContainer" class="map-container hidden">
            <div class="map-wrapper">
                <h2 class="section-title">
                    <i class="fas fa-globe"></i>
                    Location Map with Landmarks
                </h2>
                <div id="map"></div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('analyzeBtn').addEventListener('click', analyzeLocation);
        document.getElementById('latitude').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                analyzeLocation();
            }
        });
        document.getElementById('longitude').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                analyzeLocation();
            }
        });

        async function analyzeLocation() {
            const analyzeBtn = document.getElementById('analyzeBtn');
            const loading = document.getElementById('loading');
            const results = document.getElementById('results');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            const mapContainer = document.getElementById('mapContainer');

            const lat = document.getElementById('latitude').value.trim();
            const lng = document.getElementById('longitude').value.trim();
            
            if (!lat || !lng) {
                showError('Please enter both latitude and longitude');
                return;
            }
            
            if (isNaN(parseFloat(lat)) || isNaN(parseFloat(lng))) {
                showError('Please enter valid numeric coordinates');
                return;
            }
            
            const requestData = { lat: parseFloat(lat), lng: parseFloat(lng) };

            // Show loading state
            analyzeBtn.disabled = true;
            loading.style.display = 'block';
            results.classList.add('hidden');
            errorMessage.classList.add('hidden');
            successMessage.classList.add('hidden');
            mapContainer.classList.add('hidden');

            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(requestData)
                });

                const data = await response.json();

                if (data.success) {
                    displayResults(data);
                    showSuccess('Analysis completed successfully!');
                } else {
                    showError(data.error || 'Analysis failed');
                }
            } catch (error) {
                showError('Network error: ' + error.message);
            } finally {
                analyzeBtn.disabled = false;
                loading.style.display = 'none';
            }
        }

        function displayResults(data) {
            const results = document.getElementById('results');
            const mapContainer = document.getElementById('mapContainer');
            
            // Update viability score
            document.getElementById('viabilityScore').textContent = data.prediction.viability_score + '/100';
            
            // Update recommendation
            const recommendation = document.getElementById('recommendation');
            recommendation.textContent = data.prediction.recommendation;
            recommendation.className = 'recommendation ' + getRecommendationClass(data.prediction.viability_score);
            
            // Update features
            const featuresGrid = document.getElementById('featuresGrid');
            featuresGrid.innerHTML = '';
            
            const features = [
                { label: 'Network Density', value: data.features.avg_node_degree.toFixed(1) + ' (Scale: 0-10)' }
            ];
            
            features.forEach(feature => {
                const featureItem = document.createElement('div');
                featureItem.className = 'feature-item';
                featureItem.innerHTML = `
                    <div class="feature-value">${feature.value}</div>
                    <div class="feature-label">${feature.label}</div>
                `;
                featuresGrid.appendChild(featureItem);
            });
            
            // Display map
            document.getElementById('map').innerHTML = data.map_html;
            
            // Show results
            results.classList.remove('hidden');
            mapContainer.classList.remove('hidden');
        }

        function getRecommendationClass(score) {
            if (score >= 70) return 'yes';
            if (score >= 30) return 'maybe';
            return 'no';
        }

        function showError(message) {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = message;
            errorMessage.classList.remove('hidden');
        }

        function showSuccess(message) {
            const successMessage = document.getElementById('successMessage');
            successMessage.textContent = message;
            successMessage.classList.remove('hidden');
            setTimeout(() => {
                successMessage.classList.add('hidden');
            }, 3000);
        }
    </script>
</body>
</html>
